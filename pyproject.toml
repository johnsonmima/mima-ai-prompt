[project]
name = "mima-ai-prompt"
version = "1.0.0"
description = "Prompt engineering for Python: typed messages, templates, validation, and canonical JSON serialization. This package does not call models, map vendor APIs, run tools, or include an agent runtime."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Johnson Olusegun", email = "olusegun.johnson.oj@gmail.com" }
]
keywords = ["ai", "llm", "prompt", "prompt-engineering", "genai", "mima"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/johnsonmima/mima-ai-prompt"
Repository = "https://github.com/johnsonmima/mima-ai-prompt"
Issues = "https://github.com/johnsonmima/mima-ai-prompt/issues"
Changelog = "https://github.com/johnsonmima/mima-ai-prompt/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["mima_ai_prompt"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
