# Dependabot — keep GitHub Actions and Python packages current
# Why: open-source libraries rot when transitive CVEs go unnoticed.
# Version-update PRs: every 6 months (1 Jan and 1 Jul UTC). Security alerts
# can still open a PR at any time.
# Python majors are ignored; take those on a human PR when you want the
# breaking upgrade.

version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: semiannually
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: semiannually
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
