# Release / Publish — mima-ai-prompt
#
# Why: open-source consumers install from PyPI. Publishing must be
# automated, tagged, and auditable — never a manual `twine upload`
# from a developer laptop with a long-lived token in shell history.
#
# Triggers: version tags like v1.0.0 or manual workflow_dispatch.
# Uses PyPI Trusted Publishing (OIDC). See:
# https://docs.pypi.org/trusted-publishers/

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack only (skip PyPI upload)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  CI: true

jobs:
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Verify git tag matches pyproject.toml version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v${TAG} does not match pyproject.toml version ${VERSION}"
            exit 1
          fi

      - name: Test with coverage
        run: >
          uv run pytest
          --cov=mima_ai_prompt
          --cov-report=term-missing
          --cov-fail-under=95

      - name: Build wheel and sdist
        run: uv build -o ./dist

      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.dry_run == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: ./dist/
